name: Propose an item
description: Something else in the formal proof that deserves a page.
title: "Proposal: "
labels: ["new-item"]
body:
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: The statement, in ordinary mathematics.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it is in the Lean source
      description: A link to the declaration, or its name and file.
  - type: textarea
    id: why
    attributes:
      label: Why it is interesting, and what you know of the literature
    validations:
      required: true
